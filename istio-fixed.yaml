# =====================================
# Microservicios
# =====================================
apiVersion: v1
kind: Namespace
metadata:
  name: service-mesh
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-bodega
  namespace: service-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-bodega
  template:
    metadata:
      labels:
        app: ms-bodega
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: ms-bodega
          image: ms-bodega:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "172.17.0.1:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-bodega
  namespace: service-mesh
  labels:
    app: ms-bodega
spec:
  selector:
    app: ms-bodega
  ports:
    - port: 8001
      targetPort: 8001
      name: http
---
