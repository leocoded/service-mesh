# =====================================
# Gateway y VirtualService
# =====================================

apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: api-gateway
  namespace: service-mesh
spec:
  selector:
    app: istio-ingress
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway
  namespace: service-mesh
spec:
  hosts:
  - "*"
  gateways:
  - api-gateway
  http:
  - match:
    - uri:
        exact: /bodegas/docs
    rewrite:
      uri: /docs
    route:
    - destination:
        host: ms-bodega
        port:
          number: 8001
  - match:
    - uri:
        exact: /bodegas/openapi.json
    rewrite:
      uri: /openapi.json
    route:
    - destination:
        host: ms-bodega
        port:
          number: 8001
  - match:
    - uri:
        prefix: /bodegas
    route:
    - destination:
        host: ms-bodega
        port:
          number: 8001
  - match:
    - uri:
        exact: /lotes/docs
    rewrite:
      uri: /docs
    route:
    - destination:
        host: ms-lote
        port:
          number: 8002
  - match:
    - uri:
        exact: /lotes/openapi.json
    rewrite:
      uri: /openapi.json
    route:
    - destination:
        host: ms-lote
        port:
          number: 8002
  - match:
    - uri:
        prefix: /lotes
    route:
    - destination:
        host: ms-lote
        port:
          number: 8002
  - match:
    - uri:
        exact: /ordenes/docs
    rewrite:
      uri: /docs
    route:
    - destination:
        host: ms-orden-compra
        port:
          number: 8005
  - match:
    - uri:
        exact: /ordenes/openapi.json
    rewrite:
      uri: /openapi.json
    route:
    - destination:
        host: ms-orden-compra
        port:
          number: 8005
  - match:
    - uri:
        prefix: /ordenes
    route:
    - destination:
        host: ms-orden-compra
        port:
          number: 8005
  - match:
    - uri:
        exact: /productos/docs
    rewrite:
      uri: /docs
    route:
    - destination:
        host: ms-producto
        port:
          number: 8003
  - match:
    - uri:
        exact: /productos/openapi.json
    rewrite:
      uri: /openapi.json
    route:
    - destination:
        host: ms-producto
        port:
          number: 8003
  - match:
    - uri:
        prefix: /productos
    route:
    - destination:
        host: ms-producto
        port:
          number: 8003
  - match:
    - uri:
        exact: /proveedores/docs
    rewrite:
      uri: /docs
    route:
    - destination:
        host: ms-proveedor
        port:
          number: 8006
  - match:
    - uri:
        exact: /proveedores/openapi.json
    rewrite:
      uri: /openapi.json
    route:
    - destination:
        host: ms-proveedor
        port:
          number: 8006
  - match:
    - uri:
        prefix: /proveedores
    route:
    - destination:
        host: ms-proveedor
        port:
          number: 8006
  - match:
    - uri:
        exact: /proyecciones/docs
    rewrite:
      uri: /docs
    route:
    - destination:
        host: ms-proyeccion-demanda
        port:
          number: 8004
  - match:
    - uri:
        exact: /proyecciones/openapi.json
    rewrite:
      uri: /openapi.json
    route:
    - destination:
        host: ms-proyeccion-demanda
        port:
          number: 8004
  - match:
    - uri:
        prefix: /proyecciones
    route:
    - destination:
        host: ms-proyeccion-demanda
        port:
          number: 8004
  - match:
    - uri:
        exact: /blockchain/docs
    rewrite:
      uri: /docs
    route:
    - destination:
        host: ms-blockchain
        port:
          number: 8007
  - match:
    - uri:
        exact: /blockchain/openapi.json
    rewrite:
      uri: /openapi.json
    route:
    - destination:
        host: ms-blockchain
        port:
          number: 8007
  - match:
    - uri:
        prefix: /blockchain
    route:
    - destination:
        host: ms-blockchain
        port:
          number: 8007