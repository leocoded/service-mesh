apiVersion: v1
kind: Namespace
metadata:
  name: traceability
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-oracle
  namespace: traceability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-oracle
  template:
    metadata:
      labels:
        app: ms-oracle
    spec:
      containers:
        - name: ms-oracle
          image: ms-oracle:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-external:9092"
          ports:
            - containerPort: 8008
---
apiVersion: v1
kind: Service
metadata:
  name: ms-oracle
  namespace: traceability
spec:
  selector:
    app: ms-oracle
  ports:
    - port: 8008
      targetPort: 8008
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-blockchain
  namespace: traceability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-blockchain
  template:
    metadata:
      labels:
        app: ms-blockchain
    spec:
      containers:
        - name: ms-blockchain
          image: ms-blockchain:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-external:9092"
          ports:
            - containerPort: 8007
---
apiVersion: v1
kind: Service
metadata:
  name: ms-blockchain
  namespace: traceability
spec:
  selector:
    app: ms-blockchain
  ports:
    - port: 8007
      targetPort: 8007
      name: http