version: '3.8'

services:
  # Infraestructura
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Microservicios del Caso de Negocio
  ms-producto:
    build:
      context: ./ms-producto
      dockerfile: ../Dockerfile
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=catalog.ms-producto
      - DOCKER_ENV=true
    volumes:
      - ./ms-producto:/app
      - ./shared:/app/shared
    depends_on:
      - kafka
    restart: unless-stopped

  ms-lote:
    build:
      context: ./ms-lote
      dockerfile: ../Dockerfile
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=inventory.ms-lote
    volumes:
      - ./ms-lote:/app
      - ./shared:/app/shared
    depends_on:
      - kafka
    restart: unless-stopped

  ms-bodega:
    build:
      context: ./ms-bodega
      dockerfile: ../Dockerfile
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=warehouse.ms-bodega
    volumes:
      - ./ms-bodega:/app
      - ./shared:/app/shared
    depends_on:
      - kafka
    restart: unless-stopped

  ms-blockchain:
    build:
      context: ./ms-blockchain
      dockerfile: ../Dockerfile
    ports:
      - "8007:8007"
    environment:
      - SERVICE_NAME=traceability.ms-blockchain
    volumes:
      - ./ms-blockchain:/app
      - ./shared:/app/shared
    depends_on:
      - kafka
    restart: unless-stopped

  ms-analytics:
    build:
      context: ./ms-analytics
      dockerfile: ../Dockerfile
    ports:
      - "8010:8010"
    environment:
      - SERVICE_NAME=analytics.ms-analytics
    volumes:
      - ./ms-analytics:/app
      - ./shared:/app/shared
    depends_on:
      - redis
    restart: unless-stopped

networks:
  default:
    name: event-mesh-network